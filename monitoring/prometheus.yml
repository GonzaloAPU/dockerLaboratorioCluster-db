global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: "postgres-node1"
    static_configs:
      - targets:
          - "postgres-exporter-node1:9187"

  - job_name: "postgres-node2"
    static_configs:
      - targets:
          - "postgres-exporter-node2:9187"

  - job_name: "postgres-node3"
    static_configs:
      - targets:
          - "postgres-exporter-node3:9187"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"